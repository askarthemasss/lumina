name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" || -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "Missing MACOS_CERTIFICATE or MACOS_SIGNING_IDENTITY repository secret." >&2
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERTIFICATE_PATH" \
            -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security find-identity -v -p codesigning

      - name: Build signed app
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: CONFIGURATION=release ./scripts/package_app.sh

      - name: Create signed DMG
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Lumina.app/Contents/Info.plist)"
          if [[ "$RELEASE_TAG" != "v$APP_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $APP_VERSION." >&2
            exit 1
          fi
          DMG_PATH="$(./scripts/make_dmg.sh | tail -n 1)"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/notarize.sh "$DMG_PATH"

      - name: Verify signed app
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Lumina.app
          xcrun stapler validate "$DMG_PATH"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$DMG_PATH" \
            --title "Lumina $APP_VERSION" \
            --generate-notes \
            --verify-tag

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain build.keychain || true
